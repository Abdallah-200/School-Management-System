<form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
  @if (error()) {
    <div class="alert alert-error">{{ error() }}</div>
  }

  <div class="form-group">
    <label for="fullName">{{ 'auth.fullName' | translate }}</label>
    <input id="fullName" type="text" formControlName="fullName" />
  </div>

  <div class="form-group">
    <label for="email">{{ 'auth.email' | translate }}</label>
    <input id="email" type="email" formControlName="email" placeholder="example@school.com" />
  </div>

  <div class="form-group">
    <label for="password">{{ 'auth.password' | translate }}</label>
    <input id="password" type="password" formControlName="password" placeholder="••••••••" />
  </div>

  <!-- <div class="form-group">
    <label for="confirmPassword">{{ 'auth.confirmPassword' | translate }}</label>
    <input id="confirmPassword" type="password" formControlName="confirmPassword" placeholder="••••••••" />
  </div> -->

  <button type="submit" class="btn btn-primary" [disabled]="loading()">
    {{ (loading() ? 'auth.registering' : 'auth.register') | translate }}
  </button>

  <p class="auth-footer">
    {{ 'auth.hasAccount' | translate }} <a routerLink="/login">{{ 'auth.login' | translate }}</a>
  </p>
</form>
